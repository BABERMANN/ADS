<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="Resultado.html" method="post">

    <label for ="inimigo">Favorito:</label>
    <input type="text" id="inimigo" name="Favorito" placeholder="Digite seu inimigo favorito">
    <br>

    <label for="password">Senha:</label>
    <input type="password" id="senha" name="senha">
    <br>

    <label for="sele">Cabra mais foda:</label>
    <select name="selecao" id="sele">
        <option value="1">Eredin</option>
        <option value="2">Julia</option>
        <option value="3">Pi</option>
        <option value="4">Gio</option>
    </select>
<br>

   <p>Qual você escolheria?</p>

<input type="radio" id="eredin" name="escolha" value="1">
<label for="eredin">Eredin</label>

<input type="radio" id="julia" name="escolha" value="2">
<label for="julia">Julia</label>

<input type="radio" id="pi" name="escolha" value="3">
<label for="pi">Pi</label>

<input type="radio" id="gio" name="escolha" value="4">
<label for="gio">Gio</label>

<br>

    <p>checkbox</p>
    <input type="checkbox" name="check1" value="1" checked>valor 1
    <input type="checkbox" name="check1" value="2">valor 2
    <input type="checkbox" name="check1" value="3">valor 3
    <br>

    <input type="submit" value="Enviar" name="submit">
</form>
</body>
</html>
