<!DOCTYPE html>
<html lang="pt-bt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas e listas</title>
</head>
<body>
    <div>
    <ol>
        <li>Eredin</li>
        <li>Julia</li>
        <li>pi</li>
        <li>gio</li>
    </ol>
    </div>
    
    <div>
    <ul>
        <li>Eredin</li>
        <li>Julia</li>
        <li>pi</li>
        <li>gio</li>
    </ul>
    </div>

    <div>
    <table>
        <tr><th>0.0</th> <th>0.1</th> <th>0.2</th></tr>
        <tr><td>1.0</td> <td>1.1</td> <td>1.2</td></tr>
        <tr><td>2.0</td> <td>2.1</td> <td>2.2</td></tr>
    </table>
    </div>

</body>
</html>
